  # --- HONG LAB ---
  hong:
    lab_name: "Hong"
    label: "3KL_vs_WT_ME-Macs proteomics and scRNA-seq data"
    contact: ""

    # Source-level defaults (can be overridden per dataset)
    defaults:
      source_type: "duckdb"
      db_path: "data/hong.duckdb"
    
    # Datasets within this source
    datasets:
      3KL_vs_WT_ME-Macs:
        study_name: "3KL_vs_WT_ME-Macs"
        study_id: 1
        display_name: "3KL vs WT - ME-Macs"
        source_type: "parquet"    #overrides source-level defaults
        data_path: "data/Hong/scrna/conversions"
        omic_type: ["scrna"]
        tables:
          expression: "expression.parquet"
          logcounts: "logcounts.parquet"
          counts: "counts.parquet"
          obs_metadata: "obs_metadata.parquet"
          feature_annotations: "feature_annotations.parquet"
          umap: "UMAP.parquet"
          pca: "PCA.parquet"
          tsne: "TSNE.parquet"
        feature_cols:
          - Gene_Symbol
          - feature_id
          - Protein_Name
          - Protein_Description
        metric_cols:
          - pct_1
          - pct_2
          - logFC
          - pvalue
          - padj
        annotations:
          - cluster
          - cell_type
          - condition
          - sample_id
          - cell_id
          - obs

      3KL_vs_WT_ME-Macs_2:
        study_name: "3KL_vs_WT_ME-Macs"
        study_id: 2
        display_name: "3KL vs WT - ME-Macs"
        source_type: "duckdb"    #overrides source-level defaults
        db_path: "data/hong.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Gene_Symbol # gene must come before protein names for hover text
          - Uniprot_ID
        metric_cols:
          - logFC
          - pvalue
        annotations:
          - Comparison
          - Subcellular_Location
        
