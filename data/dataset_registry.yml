# Dataset Registry config file for Neuromics Explorer
# YAML file defines all available data sources and datasets for dynamic data import

sources:

  # '':
  #   lab_name: ""
  #   label: "Select a source..."
  #   contact: ""
  #   defaults:
  #   datasets: {}

  # --- DÍAZ CASTRO LAB ---
  diaz:
    lab_name: "Díaz Castro"
    label: "Proteomic and bulk RNA-seq data"
    contact: ""

    # Source-level defaults (can be overridden per dataset)
    defaults:
      source_type: "sqlite"
      db_path: "data/diaz_castro.duckdb"
    
    # Datasets within this source - SQLite
    datasets:
      Astrocyte_TurboID_vs_tdT:
        study_name: "Astrocyte_TurboID_vs_tdT"
        study_id: 1
        display_name: "Astrocyte - TurboID vs tdT"
        source_type: "sqlite"    #overrides source-level defaults
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"] # as vector, not list
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
        # annotations:
        #   - Sample_or_condition_A
        #   - Sample_or_condition_B
        #   - DE 
      Endfoot_LPS_vs_PBS:
        study_name: "Endfoot_LPS_vs_PBS"
        study_id: 2
        display_name: "Endfoot - LPS vs PBS"
        source_type: "sqlite"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
      Endfoot_TurboID_vs_tdT:
        study_name: "Endfoot_TurboID_vs_tdT"
        study_id: 3
        display_name: "Endfoot - TurboID vs tdT"
        source_type: "sqlite"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
      Human_vessel_vs_bulk:
        study_name: "Human_vessel_vs_bulk"
        study_id: 4
        display_name: "Human - vessel vs bulk"
        source_type: "sqlite"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
      BEC_RNAseq:
        study_name: "BEC_RNAseq"
        study_id: 1
        display_name: "BEC bulk RNAseq "
        source_type: "sqlite"    #overrides source-level defaults
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["bulk"] # as vector, not list
        tables:
          expression: "bulk_exp"
          study_info: "study_info"
          metadata: "bulk_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Ensembl_id
          - Entrez_id
        metric_cols:
          - abundance_A
          - abundance_B
          - expression_metric
          - logFC
          - padj
          - pvalue
        # annotations:
        #   - Sample_or_condition_A
        #   - Sample_or_condition_B
        #   - DE 
  
  # --- HONG LAB ---
  hong:
    lab_name: "Hong"
    label: "3KL_vs_WT_ME-Macs proteomics and scRNA-seq data"
    contact: ""

    # Source-level defaults (can be overridden per dataset)
    defaults:
      source_type: "sqlite"
      db_path: "data/hong.duckdb"
    
    # Datasets within this source - SQLite
    datasets:
      3KL_vs_WT_ME-Macs:
        study_name: "3KL_vs_WT_ME-Macs"
        study_id: 1
        display_name: "3KL vs WT - ME-Macs"
        source_type: "sqlite"    #overrides source-level defaults
        db_path: "data/hong.duckdb"
        omic_type: ["scrna"]
        tables:
          expression: "sc_deg_results"
          counts: "sc_normalised_expr"
          study_info: "study_info"
          metadata: "sc_metadata"
          features_metadata: "sc_gene_info"
        feature_cols:
          - Gene_Symbol
          - Protein_Name
          - Protein_Description
          - cell_type # - Cell_Type
          # - Cell_ID
        metric_cols:
          - pct_1
          - pct_2
          - logFC
          - pvalue
          - padj
        # annotations:
          # `- cell_type` OR `cell_label: "cell_type"`
          # - cluster
        reductions:
          - name: "UMAP"
            dim_name: "UMAP"
          - name: "tSNE"
            dim_name: "tSNE"
          - name: "PCA"
            dim_name: "PCA"

      3KL_vs_WT_ME-Macs_2:
        study_name: "3KL_vs_WT_ME-Macs"
        study_id: 2
        display_name: "3KL vs WT - ME-Macs"
        source_type: "sqlite"    #overrides source-level defaults
        db_path: "data/hong.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Gene_Symbol # gene must come before protein names for hover text
          - Uniprot_ID
        metric_cols:
          - logFC
          - pvalue
        # annotations:
        #   - DE
        #   - Subcellular_Location
          # `- cell_type` OR `cell_label: "cell_type"`
          # comparison_status: "DE" 
          # feature_description: "Subcellular_Location"
        
