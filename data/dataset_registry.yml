# Dataset Registry config file for Neuromics Explorer
# YAML file defines all available data sources and datasets for dynamic data import

sources:

  # '':
  #   lab_name: ""
  #   label: "Select a source..."
  #   contact: ""
  #   defaults:
  #   datasets: {}

  # --- DÍAZ CASTRO LAB ---
  diaz:
    lab_name: "Díaz Castro"
    label: "Proteomic and bulk RNA-seq data"
    contact: ""

    # Source-level defaults (can be overridden per dataset)
    defaults:
      source_type: "duckdb"
      db_path: "data/diaz_castro.duckdb"
    
    # Datasets within this source - DuckDB
    datasets:
      Astrocyte_TurboID_vs_tdT:
        study_name: "Astrocyte_TurboID_vs_tdT"
        study_id: 1
        display_name: "Astrocyte - TurboID vs tdT"
        source_type: "duckdb"    #overrides source-level defaults
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
        annotations:
          - Sample_or_condition_A
          - Sample_or_condition_B
          - DE
      Endfoot_LPS_vs_PBS:
        study_name: "Endfoot_LPS_vs_PBS"
        study_id: 2
        display_name: "Endfoot - LPS vs PBS"
        source_type: "duckdb"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
        annotations:
          - Sample_or_condition_A
          - Sample_or_condition_B
          - DE
      Endfoot_TurboID_vs_tdT:
        study_name: "Endfoot_TurboID_vs_tdT"
        study_id: 3
        display_name: "Endfoot - TurboID vs tdT"
        source_type: "duckdb"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
        annotations:
          - Sample_or_condition_A
          - Sample_or_condition_B
          - DE
      Human_vessel_vs_bulk:
        study_name: "Human_vessel_vs_bulk"
        study_id: 4
        display_name: "Human - vessel vs bulk"
        source_type: "duckdb"
        db_path: "data/diaz_castro.duckdb"
        omic_type: ["proteomics"]
        tables:
          expression: "proteomics_exp"
          study_info: "study_info"
          metadata: "proteomics_metadata"
        feature_cols:
          - Mouse_Gene
          - Human_Gene
          - Uniprot_id
          - Protein_Name
        metric_cols:
          - abundance_A
          - abundance_B
          - logFC
          - pvalue
          - padj
        annotations:
          - Sample_or_condition_A
          - Sample_or_condition_B
          - DE
      BEC_RNAseq:
